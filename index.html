<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14281f"><title>Untangle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:linear-gradient(#1d3b2d,#0f1f18);color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:22px;font-weight:700;pointer-events:none}
#lvl{background:#ffffff18;padding:6px 16px;border-radius:20px}
canvas{position:fixed;inset:0;width:100%;height:100%}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:16px;padding:18px}
button{font-size:26px;width:64px;height:56px;border:0;border-radius:16px;background:#ffffff1f;color:#fff}
button:active{background:#ffffff40}
#win{position:fixed;inset:0;background:#000a;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:70px;gap:20px}
#win button{width:150px;font-size:40px;background:#4caf50;height:70px}
#win.show{display:flex}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span>🪢</span><span id="lvl">1</span><span id="cr">0</span></div>
<div id="bar"><button id="reset">🔄</button><button id="skip">⏭</button></div>
<div id="win"><div>🎉</div><button id="next">▶</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,dpr=window.devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);
let level=+localStorage.getItem('ut_level')||1,pts=[],edges=[],drag=-1,solved=false,bad=new Set();
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function cross(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;
}
function gen(l){
  const n=Math.min(5+l,22),r=rng(l*104729+7);
  // random planar graph: random points, add non-crossing edges shortest first
  const P=[];for(let i=0;i<n;i++)P.push({x:r(),y:r()});
  const cand=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)cand.push([i,j,Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y)]);
  cand.sort((a,b)=>a[2]-b[2]);const E=[];
  for(const [i,j] of cand){
    if(E.length>=Math.floor(n*1.6))break;
    if(!E.some(([a,b])=>a!==i&&a!==j&&b!==i&&b!==j&&cross(P[a],P[b],P[i],P[j])))E.push([i,j]);
  }
  edges=E;
  // scramble: place on a circle in random order (guaranteed tangled)
  let tries=0;
  do{
    const order=[...Array(n).keys()].sort(()=>r()-.5);
    pts=order.map((o,k)=>({x:.5+.4*Math.cos(k/n*6.283),y:.5+.4*Math.sin(k/n*6.283)}));
    const tmp=[];order.forEach((o,k)=>tmp[o]=pts[k]);pts=tmp;
    tries++;calc();
  }while(bad.size<Math.max(3,E.length/4)&&tries<40);
}
function px(p){const m=40,top=70,bot=100;return{x:m+p.x*(W-2*m),y:top+p.y*(H-top-bot)}}
function calc(){
  bad=new Set();
  for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++){
    const [a,b]=edges[i],[c,d]=edges[j];
    if(a===c||a===d||b===c||b===d)continue;
    if(cross(pts[a],pts[b],pts[c],pts[d])){bad.add(i);bad.add(j)}
  }
  const el=$('cr');if(el)el.textContent=bad.size?'✂ '+bad.size:'✓';
}
let t0=0;
function draw(){
  ctx.clearRect(0,0,W,H);ctx.lineCap='round';
  edges.forEach(([a,b],i)=>{
    const A=px(pts[a]),B=px(pts[b]);
    const col=bad.has(i)?'#ff5a5a':'#7dffa0';
    ctx.strokeStyle='#0006';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(A.x+2,A.y+3);ctx.lineTo(B.x+2,B.y+3);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
  });
  pts.forEach((p,i)=>{
    const q=px(p);ctx.beginPath();ctx.arc(q.x,q.y,i===drag?22:17,0,7);
    ctx.fillStyle=i===drag?'#fff':'#ffd23d';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#0008';ctx.stroke();
  });
}
function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}}
function down(e){
  if(solved)return;const m=pos(e);let best=-1,bd=34;
  pts.forEach((p,i)=>{const q=px(p),d=Math.hypot(q.x-m.x,q.y-m.y);if(d<bd){bd=d;best=i}});
  drag=best;draw();
}
function move(e){
  if(drag<0)return;e.preventDefault();const m=pos(e),mm=40,top=70,bot=100;
  pts[drag].x=Math.max(0,Math.min(1,(m.x-mm)/(W-2*mm)));
  pts[drag].y=Math.max(0,Math.min(1,(m.y-top)/(H-top-bot)));
  calc();draw();
}
function up(){
  if(drag>=0){drag=-1;draw();
    if(!bad.size&&!solved){solved=true;level++;localStorage.setItem('ut_level',level);
      if(navigator.vibrate)navigator.vibrate(150);
      setTimeout(()=>$('win').classList.add('show'),300)}}
}
cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up);
cv.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
function start(){solved=false;$('win').classList.remove('show');$('lvl').textContent=level;gen(level);draw()}
$('reset').onclick=start;
$('skip').onclick=()=>{level++;localStorage.setItem('ut_level',level);start()};
$('next').onclick=start;
resize();start();
</script></body></html>
